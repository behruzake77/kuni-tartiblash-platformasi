services:
  ordo:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # ORDO_SYNC_TOKEN: change-me
      # NEXT_PUBLIC_ORDO_AUTH: local
    volumes:
      - ordo-data:/app/.data
    restart: unless-stopped

volumes:
  ordo-data:
